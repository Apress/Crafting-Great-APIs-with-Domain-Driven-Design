asyncapi: 3.0.0
info:
  title: Book Purchesed API
  version: 1.0.0
  description: The API notifies when a book get purchesed.
servers:
  event-broker-library:
    host: broker.online-library.org:8092
    protocol: kafka
    description: Event broker of the online library
    bindings:
      kafka:
        schemaRegistryUrl: 'https://online-library-schema-registry.com'
        schemaRegistryVendor: 'confluent'
        bindingVersion: '0.5.0'
channels:
  BookPurchasedEventAvroChannel:
    description: Channel where messages are stored when a book was purchased in Avro
    address: book-purchased-avro
    messages:
      BookPurchasedEventAvro:
        $ref: '#/components/messages/BookPurchasedEventAvro'
    bindings:
      kafka:
        topic: 'book-purchased-avro'
        bindingVersion: '0.5.0'
operations:
  BookPurchasedEventReceive:
    action: "receive"
    channel:
      $ref: "#/channels/BookPurchasedEventAvroChannel"
    bindings:
      kafka:
        bindingVersion: '0.5.0'
        groupId:
          type: string
          pattern: ^cg-book-purchased-avro.*$
components:
  messages:
    BookPurchasedEventAvro:
      headers:
        $ref: '#/components/schemas/MessageHeader'
      payload:
        schemaFormat: 'application/vnd.apache.avro+yaml;version=1.9.0'
        schema:
          type: record
          name: Book
          namespace: com.example
          doc: A schema representing a book and its metadata for the library for, e.g., search results
          fields:
            - name: isbn13
              type: string
              doc: The 13-digit ISBN, e.g., 9781234567890
            - name: title
              type: string
              doc: The title of the book
            - name: coverThumbnailWebP
              type:
                - "null"
                - bytes
              default: null
              doc: Base64 encoded WebP image of the book cover thumbnail
            - name: authors
              type:
                type: array
                items:
                  type: record
                  name: Author
                  fields:
                    - name: name
                      type: string
                      doc: 'The full name of the author with titles, e.g.: "Eric Evans", "Dr. John Smith"'
                    - name: portraitThumbnailWebP
                      type:
                        - "null"
                        - bytes
                      default: null
                      doc: Base64 encoded WebP image of the author's portrait thumbnail
              doc: List of authors of the book
            - name: numberOfTextPosition
              type: long
              doc: The number of text position in the book
            - name: category
              type:
                type: enum
                name: Category
                symbols:
                  - NON_FICTION
                  - FICTION
              doc: The main category of the book
            - name: tags
              type:
                type: array
                items: string
              doc: List of tags associated with the book (top 20)
            - name: rating
              type:
                - "null"
                - bytes
              default: null
              logicalType: decimal
              precision: 2
              scale: 1
              doc: The average rating of the book (0 to 5 stars, with one decimal place), e.g., 4.5
            - name: hasValidLicense
              type: boolean
              doc: Indicates whether the library has a valid license for the book at the moment
              default: true
            - name: publishingDate
              type:
                type: string
                pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
              doc: The date when the book was published in yyyy-mm-dd format ([Date](https://avro.apache.org/docs/1.8.0/spec.html#Date) was not used as it does not allow to store values before the unix epoch, 1 January 1970)
      bindings:
        kafka:
          bindingVersion: '0.5.0'
          key:
            type: string
            format: uuid
  schemas:
    MessageHeader:
      type: object
      properties:
        orderDate:
          type: string
          format: date-time
      required:
        - orderDate
