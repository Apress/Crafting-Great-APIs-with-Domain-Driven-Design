# Schemas for reusing (copy-paste)

schemas:
  AuthorShort:
    description: Author of a book
    type: object
    required:
      - authorId
      - givenName
      - familyName
    properties:
      authorId:
        description: Identifier of the author
        type: string
        format: uuid
        examples:
          - 08a13654-05f3-4664-8c8d-fdd9114ec3be
      givenName:
        description: Given name of the author
        type: string
        minLength: 2
        maxLength: 55
        examples:
          - Kent
      familyName:
        description: Family name of the author
        type: string
        minLength: 2
        maxLength: 55
        examples:
          - Beck

  AuthorFull:
    description: Full description of an author
    type: object
    allOf:
      - $ref: '#/components/schemas/AuthorShort'
    properties:
      authorPortraitWebP:
        description: Portrait of the author as WebP
        type: string
        format: binary
      authorBiography:
        description: Short bio of the author
        type: string
        minLength: 10
        maxLength: 2048

  BookShort:
    description: Book which was purchased by the librarians
    type: object
    required:
      - isbn13
    properties:
      bookIdentifier:
        description: Identifier of a book
        type: string
        format: uuid
        examples:
          - 5dda405a-d28e-490a-8508-1ea3453e91ae
      isbn13:
        description: ISBN (international standard book number) with 13 characters
        type: string
        pattern: ^(?:ISBN(?:-13)?:?\ )?(?=[0-9]{13}$|(?=(?:[0-9]+[-\ ]){4})[-\ 0-9]{17}$)97[89][-\ ]?[0-9]{1,5}[-\ ]?[0-9]+[-\ ]?[0-9]+[-\ ]?[0-9]$
        examples:
          - 9780321146530
          - ISBN 978-0321-14653-0
      authors:
        description: Authors of the book
        minItems: 1
        maxItems: 10
        items:
          $ref: '#/components/schemas/AuthorShort'
      areEditors:
        description: Flag to set to true if the book is published by editors
        type: boolean
        default: false
        examples:
          - true
      editor:
        $ref: '#/components/schemas/Editor'
      title:
        description: Title of the book
        type: string
        minLength: 2
        maxLength: 255
        examples:
          - Test-Driven Development
      subtitle:
        description: Subtitle of the book
        type: string
        minLength: 2
        maxLength: 255
        examples:
          - By Example

  BookFull:
    description: A full book including cover image
    type: object
    allOf:
      - $ref: '#/components/schemas/BookShort'
    properties:
      coverImageWebP:
        description: Cover image of the book
        type: string
        format: binary

  Editor:
    description: Editor of a book
    type: object
    required:
      - name
    properties:
      name:
        description: Name of the editor
        type: string
        minLength: 2
        maxLength: 55
        examples:
          - Springer Nature
          - Addison-Weasley
      city:
        description: Location of the editor
        type: string
        minLength: 2
        maxLength: 55
        examples:
          - Cham, Switzerland
          - Boston

  SearchMetaData:
    description: Meta data for a search result
    type: object
    required:
      - resultCount
      - offset
      - limit
    properties:
      resultCount:
        description: Count of results of the current search
        type: integer
        minimun: 0
        maximum: 10000
        format: int32
        examples:
          - 250
      offset:
        description: Offset of the delivered result
        type: integer
        minimum: 0
        maximum: 10000
        examples:
          - 0
      limit:
        description: Number of single result entries delivered in the search
        type: integer
        minimum: 1
        maximum: 50
        examples: 30